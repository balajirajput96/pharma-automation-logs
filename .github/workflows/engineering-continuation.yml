name: Engineering Continuation

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

concurrency:
  group: engineering-continuation
  cancel-in-progress: false

jobs:
  collect-and-record:
    name: Collect engineering state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Collect factual GitHub state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/run_continuation_cycle.py

      - name: Commit state record
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- state/; then
            echo "No state record changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "chore: record engineering continuation cycle"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "State rebase conflict; refusing to push an ambiguous record." >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "State record pushed on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "State push failed after bounded retries." >&2
          exit 1
